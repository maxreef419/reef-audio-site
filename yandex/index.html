<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>REEF — reel for Яндекс</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/yandex/assets/favicon-32.png">
<link rel="preconnect" href="https://player.vimeo.com" crossorigin>
<link rel="preconnect" href="https://i.vimeocdn.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<script src="https://player.vimeo.com/api/player.js"></script>
<style>
:root{
  --bg:#2e2e2e;
  --surface:#383838;
  --line:rgba(255,255,255,.12);
  --text:#f4f6f6;
  --muted:#b4b7b7;
  --accent:#19b6e6;
  --font-display:'Schibsted Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-body:'Instrument Sans','Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --maxw:1240px;
  --pad:clamp(20px,4.5vw,64px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* ===== header ===== */
.hdr{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(46,46,46,.95) 0%,rgba(46,46,46,.75) 70%,rgba(46,46,46,0) 100%);
  backdrop-filter:blur(8px);
  padding:clamp(18px,2.6vw,28px) var(--pad);
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.hdr__logo{display:flex;align-items:center;gap:12px}
.hdr__logo img{height:38px;width:auto;object-fit:contain}
.hdr__logo span{
  font-family:var(--font-display);font-weight:700;font-size:clamp(15px,1.4vw,18px);
  letter-spacing:.01em;color:var(--text)
}
.hdr__meta{
  font-family:var(--font-body);font-weight:500;font-size:12px;
  letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
}

/* ===== hero ===== */
.hero{
  max-width:var(--maxw);margin:0 auto;padding:clamp(48px,10vw,120px) var(--pad) clamp(32px,6vw,72px);
}
.hero h1{
  font-family:var(--font-display);font-weight:800;
  font-size:clamp(40px,7vw,96px);line-height:.98;letter-spacing:-.025em;
}
.hero h1 .cy{color:var(--accent)}
.hero__sub{
  margin-top:clamp(16px,2.4vw,28px);
  max-width:56ch;
  font-size:clamp(15px,1.3vw,18px);line-height:1.55;color:var(--muted);
}

/* ===== reel ===== */
.reel{
  max-width:var(--maxw);margin:0 auto;padding:0 var(--pad) clamp(80px,12vw,140px);
  display:flex;flex-direction:column;gap:clamp(56px,8vw,104px);
}
.clip{
  display:flex;flex-direction:column;gap:clamp(14px,1.6vw,20px);
}
.clip__frame{
  position:relative;width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:6px;
  overflow:hidden;
  box-shadow:0 30px 80px -30px rgba(0,0,0,.7), 0 10px 30px -12px rgba(0,0,0,.5);
}
.clip__frame::before{
  content:"";position:absolute;inset:0;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-color:#000;
  background-image:var(--poster);
  transform:scale(var(--poster-zoom,1));
  transform-origin:center;
  filter:brightness(.85);
  transition:opacity .5s var(--ease);
  z-index:1;
}
.clip.is-ready .clip__frame::before{opacity:0;pointer-events:none}
.clip__frame iframe{
  position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2;
  opacity:0;transition:opacity .5s var(--ease) .1s;
}
.clip.is-ready .clip__frame iframe{opacity:1}
.clip__play{
  position:absolute;inset:0;z-index:3;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:transparent;border:0;
  transition:opacity .3s var(--ease);
}
.clip.is-ready .clip__play{opacity:0;pointer-events:none}
.clip__ring{
  width:clamp(64px,7vw,96px);height:clamp(64px,7vw,96px);
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,.7);
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  transition:transform .35s var(--ease),background .3s,border-color .3s;
}
.clip__play:hover .clip__ring{transform:scale(1.08);background:rgba(0,0,0,.4);border-color:#fff}
.clip__tri{
  width:0;height:0;
  border-style:solid;
  border-width:clamp(11px,1.1vw,14px) 0 clamp(11px,1.1vw,14px) clamp(17px,1.7vw,22px);
  border-color:transparent transparent transparent #fff;
  margin-left:4px;
}
.clip__caption{
  display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding:0 2px;
}
.clip__num{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(13px,1.15vw,15px);
  letter-spacing:.14em;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.clip__title{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(20px,2.4vw,32px);
  line-height:1.15;letter-spacing:-.01em;color:var(--text);
  flex:1;min-width:0;
}
.clip__meta{
  font-family:var(--font-body);font-weight:500;
  font-size:clamp(12px,1vw,13px);
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* ===== footer ===== */
.foot{
  border-top:1px solid var(--line);
  padding:clamp(60px,8vw,90px) var(--pad) 30px;
}
.foot__inner{
  max-width:var(--maxw);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap;
  padding-bottom:34px;border-bottom:1px solid var(--line);
}
.foot__logo{display:flex;align-items:center}
.foot__logo img{height:32px;width:auto;object-fit:contain}
.foot__tag{color:var(--muted);font-size:14px;max-width:30ch}
.foot__links{display:flex;gap:24px}
.foot__links a{font-size:14px;font-weight:600;color:var(--muted);transition:color .25s}
.foot__links a:hover{color:var(--accent)}
.foot__bottom{
  max-width:var(--maxw);margin:24px auto 0;
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  font-size:13px;color:var(--muted);letter-spacing:.02em;
}

/* ===== reveal ===== */
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:translateY(0)}

@media (max-width:640px){
  .hdr{padding:14px var(--pad)}
  .hero{padding-top:32px;padding-bottom:24px}
  .hero__sub{max-width:none}
  .clip__caption{flex-direction:row;align-items:baseline}
}

@media (max-width:560px){
  .foot__inner{flex-direction:column;align-items:flex-start;gap:20px}
  .foot__bottom{justify-content:space-between;gap:14px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}
}
</style>
</head>
<body>

<header class="hdr">
  <a href="https://www.thereefaudio.com" class="hdr__logo" target="_blank" rel="noopener" aria-label="REEF Audio home">
    <img src="/yandex/assets/brand-logo.png" alt="REEF Audio" width="404" height="175">
  </a>
  <div class="hdr__meta">Reel · 2026</div>
</header>

<section class="hero">
  <h1 class="rv">Selected work<br><span class="cy">for Яндекс.</span></h1>
  <p class="hero__sub rv">A selection of REEF Audio projects. Original music and sound design for Russian and international brands.</p>
</section>

<main class="reel" id="reel"></main>

<footer class="foot">
  <div class="foot__inner">
    <a href="https://www.thereefaudio.com" class="foot__logo" target="_blank" rel="noopener" aria-label="REEF Audio home">
      <img src="/yandex/assets/brand-logo.png" alt="REEF Audio" width="404" height="175">
    </a>
    <p class="foot__tag">Original music, sound design and sonic branding worldwide.</p>
    <div class="foot__links">
      <a href="mailto:max@thereefaudio.com">Email</a>
      <a href="https://vimeo.com/reefaudio" target="_blank" rel="noopener">Vimeo</a>
      <a href="https://www.instagram.com/reef_audio" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
  <div class="foot__bottom">
    <span>© <span id="year"></span> REEF Audio</span>
    <span>Made with intent.</span>
  </div>
</footer>

<script>
const CLIPS = [
  {id:"910327781", title:"Yandex Split", duration:20, poster:"https://i.vimeocdn.com/video/1794258113-f1593deddd793c9f0b5125fe2a7aabb67dcc074a834212c93a4ef24d58b8fb18-d_1280?region=us"},
  {id:"1211741208", title:"Fonbet", duration:77, poster:"https://i.vimeocdn.com/video/2182751118-3c7da5faf1594ff634f24ecd2879f984658fd6b30ba329644ce6c3787bca853b-d_1280?region=us"},
  {id:"1212357476", title:"Sber", duration:55, poster:"https://i.vimeocdn.com/video/2182762473-e635b1f5256e4112a127fda3e5c0fc9c455d4ef0a8bb90dfab9738c5ef73d6e9-d_1280?region=us"},
  {id:"468648611", title:"Adrenaline Gold", duration:29, poster:"https://i.vimeocdn.com/video/975900000-f12a877a09a29ca1daa6ca261c6a6da8ff2ecbc1e078b968286ae47bca7b320c-d_1280?region=us"},
  {id:"882659457", title:"Yango Maps", duration:33, poster:"https://i.vimeocdn.com/video/2174105717-3e29ff6219a88991a0fe64beb5b47346fc23d14742b7075e830c1abd52ee8696-d_1280?region=us"},
  {id:"849692144", title:"California Realtors", duration:60, poster:"https://i.vimeocdn.com/video/1703777150-5aca46a0a63208eb8390e57191b9194d24d758acb1a5c139b3e6aeab1c9627fc-d_1280?region=us"},
  {id:"690914061", title:"KIA", duration:94, poster:"https://i.vimeocdn.com/video/1398855299-d14c758d4119697797a5211bc8bcb45a7db7cc594d138a8f0d357acfa57274e2-d_1280?region=us"},
  {id:"1158151394", title:"Sber Investment", duration:62, poster:"https://i.vimeocdn.com/video/2174080919-e4362ed56ee3697e2e0757f985fb757b04e07ee4f4d996a2a008e65eedc88c7b-d_1280?region=us"},
  {id:"652793889", title:"McDonald's", duration:30, posterZoom:1.35, poster:"https://i.vimeocdn.com/video/1317275530-b104682c3777be891d97eb823baf0fcaea245ea2da6e28dfb9763a1c371c0f05-d_1280?region=us"},
  {id:"554243009", title:"Whole Foods", duration:53, poster:"https://i.vimeocdn.com/video/1145467476-f7bd22ad4eb12af88e5ab356646e2a7b2c06e38116ff43552264e644d2dbed98-d_1280?region=us"},
  {id:"1053336088", title:"KIA K5", duration:70, poster:"https://i.vimeocdn.com/video/1978487923-80a6b2c716ede09db4b2af9422686a12448635ac316e7144453ea819160b2d90-d_1280?region=us"},
  {id:"416039838", title:"Volkswagen", duration:30, poster:"https://i.vimeocdn.com/video/889731453-9c5c1bbd6e3f2caed6f5e3bb9c8354f864574f3fd91506a7e61d350426af81f3-d_1280?region=us"}
];

const fmtDur = s => {
  const m = Math.floor(s/60), r = s%60;
  return m>0 ? `${m}:${String(r).padStart(2,'0')}` : `0:${String(r).padStart(2,'0')}`;
};
const pad2 = n => String(n).padStart(2,'0');
// Posters come straight from Vimeo's own CDN (i.vimeocdn.com), which is reachable
// without a VPN. Fall back to vumbnail only if a clip has no poster set.
const posterUrl = c => c.poster || `https://vumbnail.com/${c.id}.jpg`;

const reel = document.getElementById('reel');
CLIPS.forEach((c, i) => {
  const el = document.createElement('article');
  el.className = 'clip rv';
  el.dataset.id = c.id;
  el.style.setProperty('--poster', `url("${posterUrl(c)}")`);
  if(c.posterZoom) el.style.setProperty('--poster-zoom', c.posterZoom);
  el.innerHTML = `
    <div class="clip__frame">
      <button class="clip__play" type="button" aria-label="Play ${c.title.replace(/"/g,'&quot;')}">
        <span class="clip__ring"><span class="clip__tri"></span></span>
      </button>
    </div>
    <div class="clip__caption">
      <span class="clip__num">${pad2(i+1)} / 10</span>
      <h2 class="clip__title">${c.title}</h2>
      <span class="clip__meta">${fmtDur(c.duration)}</span>
    </div>
  `;
  reel.appendChild(el);
});

// reveal on scroll
const revIo = new IntersectionObserver((entries)=>{
  entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); revIo.unobserve(e.target); } });
},{rootMargin:"0px 0px -8% 0px",threshold:0.06});
document.querySelectorAll('.rv').forEach(el => revIo.observe(el));

// click-to-load iframe (keeps page lightweight — 10 vimeo players at once is heavy)
// Only one clip plays at a time: starting one pauses all others.
const players = [];
function loadClip(clip){
  if(clip.classList.contains('is-ready')) return;
  const id = clip.dataset.id;
  const frame = clip.querySelector('.clip__frame');
  const iframe = document.createElement('iframe');
  iframe.src = `https://player.vimeo.com/video/${id}?app_id=122963&autoplay=1&title=0&byline=0&portrait=0&dnt=1&color=19b6e6`;
  iframe.setAttribute('allow','autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share');
  iframe.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
  iframe.setAttribute('title', clip.querySelector('.clip__title').textContent);
  frame.appendChild(iframe);
  clip.classList.add('is-ready');

  // Wire up the Vimeo SDK so we can pause other players when this one starts.
  if(window.Vimeo && Vimeo.Player){
    const player = new Vimeo.Player(iframe);
    players.push(player);
    player.on('play', () => {
      players.forEach(p => { if(p !== player){ p.pause().catch(()=>{}); } });
    });
  }
}
document.querySelectorAll('.clip__play').forEach(btn=>{
  btn.addEventListener('click', e => {
    e.preventDefault();
    loadClip(btn.closest('.clip'));
  });
});

/* footer year */
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
