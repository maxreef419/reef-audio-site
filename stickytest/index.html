<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sticky test</title>
<style>
  /* Deliberately minimal. NO overflow / transform / filter / perspective / contain on any
     ancestor of the sticky container. This is the clean isolation the plan asks for. */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#111;color:#eee;font:600 15px/1.4 -apple-system,system-ui,sans-serif}
  .fixedheader{position:fixed;top:0;left:0;right:0;height:60px;z-index:100;
    display:flex;align-items:center;padding:0 16px;background:#19b6e6;color:#000}
  .spacer{height:130vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(#222,#000);text-align:center;padding:20px}
  /* THE TRANSITION STAGE — tall so we scroll through it */
  .stage{position:relative;height:210vh;background:#3a0d0d}
  /* THE STICKY VIEWPORT CONTAINER — must stay stationary while scrolling the stage */
  .pin{position:sticky;position:-webkit-sticky;top:60px;height:calc(100vh - 60px);height:calc(100dvh - 60px);
    display:flex;align-items:center;justify-content:center;
    background:repeating-linear-gradient(45deg,#0a5,#0a5 24px,#083 24px,#083 48px);
    color:#000;font:800 22px/1.3 monospace;text-align:center}
  .after{height:130vh;display:flex;align-items:center;justify-content:center;background:#000}
  #dbg{position:fixed;left:6px;right:6px;bottom:6px;z-index:200;font:600 12px/1.5 monospace;
    color:#4ade80;background:rgba(0,0,0,.85);padding:8px 10px;border-radius:8px;
    pointer-events:none;white-space:pre-wrap}
</style>
</head>
<body>
  <div class="fixedheader">FIXED HEADER (stays on top)</div>

  <div class="spacer">Scroll down ↓<br>the green sticky panel must FREEZE while the red stage scrolls</div>

  <div class="stage" id="stage">
    <div class="pin" id="pin">
      GREEN STICKY PANEL<br>I must stay perfectly still<br>while you scroll the red stage
    </div>
  </div>

  <div class="after">After the stage — normal scrolling</div>

  <div id="dbg">sticky test — scroll into the stage</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var pin = document.getElementById('pin');
  var dbg = document.getElementById('dbg');
  var ticking = false;
  function update(){
    ticking = false;
    var sRect = stage.getBoundingClientRect();
    var pRect = pin.getBoundingClientRect();
    // progress through the stage: 0 when stage top hits header, 1 when stage bottom reaches
    var headH = 60;
    var total = stage.offsetHeight - (window.innerHeight - headH);
    var scrolled = (headH - sRect.top);
    var p = total > 0 ? scrolled/total : 0;
    p = p<0?0:p>1?1:p;
    // If sticky works, pin.top should hold at ~60 while progress goes 0->1.
    dbg.textContent =
      'STICKY TEST\n' +
      'stage.top   = ' + sRect.top.toFixed(1) + '\n' +
      'pin.top     = ' + pRect.top.toFixed(1) + '  (should stay ~60 while in stage)\n' +
      'progress    = ' + p.toFixed(3);
  }
  function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(update); } }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll, {passive:true});
  update();
})();
</script>
</body>
</html>
